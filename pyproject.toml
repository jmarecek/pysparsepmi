[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "pysparsepmi"
version = "0.1.0"
description = "Sparse sum-of-squares chordal decomposition of polynomial matrix inequalities (port of YALMIP's sos.csp / TSSOS PMI functionality)"
readme = "README.md"
requires-python = ">=3.7"
license = { text = "MIT" }
authors = [{ name = "Jakub Marecek", email = "jakub.marecek@gmail.com" }]
keywords = [
    "sum-of-squares",
    "semidefinite-programming",
    "polynomial-optimization",
    "chordal-sparsity",
    "polynomial-matrix-inequality",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.17", "cvxpy>=1.1"]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/jmarecek/pysparsepmi"

[tool.setuptools]
packages = ["pysparsepmi"]
